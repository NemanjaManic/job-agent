# config.yaml — filteri i podešavanja agenta.
# Menja se ovaj fajl kad želiš da promeniš ponašanje agenta, ne kod.

profile:
  # Kratak opis profila za LLM rangiranje (Faza 2) — dopuniti kasnije.
  summary: ""
  skills: []
  target_roles:
    - "Junior AI Engineer"
    - "Junior ML Engineer"
    - "AI/ML Internship"
    - "Machine Learning Intern"

filters:
  seniority: ["junior", "intern", "entry level", "no experience required"]
  locations:
    - "Serbia"
    - "Remote"
  # Sloj 1 (širok filter) — vidi PLAN.md sekcija 3.1. Namerno bez negative_keywords za sada.
  positive_keywords:
    - "AI"
    - "machine learning"
    - "ML"
    - "data"
    - "python"
    - "praksa"
    - "internship"
    - "junior"
  negative_keywords: []

sources:
  # Rezultat izviđanja iz Faze 0.5 (PLAN.md sekcija 5). Redosled = redosled implementacije.
  enabled:
    - id: remoteok
      method: api
      phase: 1
    - id: weworkremotely
      method: rss
      phase: 2
    - id: helloworld_rs
      method: scraping
      phase: 2b
    - id: infostud_it_beograd
      method: scraping
      phase: 2b
      note: "samo kategorijske stranice (npr. /oglasi-za-posao-it/*), NIKAD /search/* — blokirano robots.txt-om"
    - id: linkedin_indeed_job_alerts
      method: email_imap
      phase: 3
    - id: serpapi_google_jobs
      method: api
      phase: 3
      note: "testirati sa pravim API ključem pre uključivanja — pokrivenost za Srbiju nije potvrđena"
  # Čekaju ručnu proveru korisnika pre odluke (PLAN.md sekcija 5):
  pending_review:
    - id: startit_rs
      note: "automatska provera dala nekonzistentne rezultate, treba potvrditi tačan URL poslovi sekcije"
    - id: ai_jobs_net_foorilla
      note: "domen ai-jobs.net sad redirect-uje na foorilla.com, API uslovi nisu bili dostupni automatskom proverom"
  # Isključeno — robots.txt blokira baš pretragu/filtere (PLAN.md sekcija 5):
  excluded:
    - id: djinni
      reason: "robots.txt blokira /q i /jobs2"
    - id: wellfound
      reason: "robots.txt blokira /search, /jobs/applications, /jobs/signup"
    - id: nofluffjobs
      reason: "nema zvaničnog javnog API-ja, direktan pristup blokiran"

llm:
  enabled: true
  score_threshold: 6
  max_calls_per_run: 50  # sigurnosni limit troška (PLAN.md sekcija 8) — ne treba da se dostigne u normalnom radu

notifications:
  telegram:
    enabled: true
  email_fallback:
    enabled: false  # uključuje se u Fazi 3

run:
  dry_run: false  # ne menjati na false dok slanje nije ručno testirano (PLAN.md sekcija 6)
