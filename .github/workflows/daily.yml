name: Daily job digest

on:
  schedule:
    # Neparan minut namerno (PLAN.md sekcija 6) — termini na pun sat najviše kasne.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.jsonl
          git diff --staged --quiet || git commit -m "chore: update seen jobs state"
          git pull --rebase
          git push
